syntax = "proto3";

import "wire.proto";

option go_package = "proto/";

package vc_hub;

service VCHubService{
    // VC-Hub related RPCs
    rpc GetAssetsByHub(GetAssetsByHubRequest) returns (GetAssetsByHubResponse);
    rpc GetFees(GetFeesRequest) returns (GetFeesResponse);
    rpc IsAddressInNetwork(IsAddressInNetworkRequest) returns (IsAddressInNetworkResponse);
    rpc GetPaymentAddress(GetPaymentAddrRequest) returns (GetPaymentAddrResponse);

    // Perun related RPCs
    rpc UpdateChannel(ChannelUpdateRequest) returns (ChannelUpdateResponse);
    rpc CloseChannel(ChannelCloseRequest) returns (ChannelCloseResponse);
    rpc GetChannels(GetChannelsRequest) returns (GetChannelsResponse);
}

// Generic rejected message. Returned by any endpoint on failure.
message Rejected {
  string reason = 1;
}

message Asset{
    bytes asset = 1;
}

message GetAssetsByHubRequest{}
message GetAssetsByHubResponse{
    repeated Asset assets = 1;
}

message IsAddressInNetworkRequest{
    string address = 1;
}

message IsAddressInNetworkResponse{
    oneof msg{
        Rejected rejected = 1;
        PeerInformation  peer = 2;
    }
}

message PeerInformation {
    string wire_address = 1;      // peer addres in perun network
    repeated Asset assets = 2;    // assets the peer has in his/her ledger channel
}

// // encoded big.Int in bytes
// message BigInt {
//     bytes data = 1;
// }

message GetPaymentAddrRequest{}
message GetPaymentAddrResponse{
    string payment_address = 1;
}

message GetFeesRequest {
    //amount : amount that this participant is going to fund
    repeated AssetAmount assets_to_fund = 1;
}

message AssetAmount{
    Asset asset = 1;
    repeated string balance_distribution = 2;  // balance  distribution for each channel
}

// Fees levied for each asset for given funds.
// User must pay at least this much to open a channel with the hub.
message GetFeesResponse {
    repeated AssetFee asset_fees = 1; // The fees for each asset in the request
}

// Asset and its corresponding  fee that must be paid
message AssetFee{
    Asset asset = 1; // The asset for which the fee is calculated
    string fee = 2; // The fee amount in the specified network's currency
}



message GetChannelsRequest {
  // The channel id of the channel to be closed.
  bytes requester = 1;
}

message GetChannelsResponse {
  oneof msg {
    Rejected rejected = 1;
    ChannelStates channel_states = 2;
  }
}

//for channel with state at index i, actor is at index i
message ChannelStates{
  repeated perunwire.State states = 1;
  repeated uint32 actor_idxs = 2; 
}

message ChannelUpdateRequest {
  // The state with which the channel should be updated.
  perunwire.State state = 1;
}

message SuccessfulUpdate {
  // The state with which the channel was updated.
  perunwire.State state = 1;
  // The channel id of the channel which was updated.
  bytes channel_id = 2;
}

message ChannelUpdateResponse {
  oneof msg {
    Rejected rejected = 1;
    SuccessfulUpdate update = 2;
  }
}

message ChannelCloseRequest {
  // The channel id of the channel to be closed.
  bytes channel_id = 1;
}

message SuccessfulClose {
  // The channel id of the channel which was closed.
  bytes channel_id = 1;
}

message ChannelCloseResponse {
  oneof msg {
    Rejected rejected = 1;
    SuccessfulClose close = 2;
  }
}